backend:
  name: github
  repo: kcompanyra-ux/Dash
  branch: main
  # We are removing base_url to use the default GitHub App flow
  
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: settings
    label: Site Settings
    files:
      - name: general
        label: General
        file: content.json
        fields:
          - name: page_title
            label: Page Title
            widget: string
          - name: main_heading
            label: Main Heading
            widget: string
