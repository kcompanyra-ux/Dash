backend:
  name: github
  repo: kcompanyra-ux/Dash
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "site_config"
    label: "Site Configuration"
    files:
      - name: "general_settings"
        label: "General Settings"
        file: "content.json"
        fields:
          - name: "page_title"
            label: "Page Title"
            widget: "string"
          - name: "main_heading"
            label: "Main Heading"
            widget: "string"
