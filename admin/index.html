<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Content Manager</title>
</head>
<body>
  <!-- Load Decap CMS -->
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.0.12/dist/decap-cms.js"></script>
  
  <script>
    window.CMS_MANUAL_INIT = true;
    
    const config = {
      backend: {
        name: 'github',
        repo: 'kcompanyra-ux/Dash', // <--- CHANGE THIS
        branch: 'main',
        // This forces it to use GitHub OAuth directly, not Netlify
        auth_type: 'implicit', 
      },
      site_url: 'https://kcompanyra-ux.github.io/Dash/', // <--- CHANGE THIS to your live URL
      media_folder: 'images/uploads',
      public_folder: '/images/uploads',
      collections: [
        {
          name: 'site_config',
          label: 'Site Configuration',
          files: [
            {
              name: 'general_settings',
              label: 'General Settings',
              file: 'content.json',
              fields: [
                { name: 'page_title', label: 'Page Title', widget: 'string' },
                { name: 'main_heading', label: 'Main Heading', widget: 'string' }
              ]
            }
          ]
        }
      ]
    };

    CMS.init({ config });
  </script>
</body>
</html>
