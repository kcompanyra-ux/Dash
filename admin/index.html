<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Content Manager</title>
</head>
<body>
  <!-- Load Decap CMS -->
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.0.12/dist/decap-cms.js"></script>
  
  <!-- Configure the GitHub App ID -->
  <script>
    window.CMS_MANUAL_INIT = true;
    const config = {
      backend: {
        name: 'github',
        repo: 'kcompanyra-ux/Dash', // <--- CHANGE THIS
        branch: 'main',
      },
      media_folder: 'images/uploads',
      public_folder: '/images/uploads',
      collections: [
        {
          name: 'settings',
          label: 'Site Settings',
          files: [
            {
              name: 'general',
              label: 'General',
              file: 'content.json',
              fields: [
                { name: 'page_title', label: 'Page Title', widget: 'string' },
                { name: 'main_heading', label: 'Main Heading', widget: 'string' }
              ]
            }
          ]
        }
      ]
    };
    
    // Initialize CMS with the config above
    CMS.init({ config });
  </script>
</body>
</html>
